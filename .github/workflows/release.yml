# Like bowel: manual runs build artifacts; only version tags publish releases.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Validate version and signing key
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: python3 scripts/check-release.py
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test before packaging
        run: go test -race -count=1 ./...
      - name: Static checks
        run: go vet ./...

  build:
    needs: check
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest, platform: darwin/arm64}
          - {os: macos-latest, platform: darwin/amd64}
          - {os: ubuntu-latest, platform: windows/amd64}
          - {os: ubuntu-latest, platform: windows/arm64}
          - {os: ubuntu-latest, platform: linux/amd64}
          - {os: ubuntu-latest, platform: linux/arm64}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS for Windows installers
        if: startsWith(matrix.platform, 'windows/')
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build installers and signed updates
        env:
          PLATFORM: ${{ matrix.platform }}
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "$PLATFORM"
      - name: Collect and verify artifacts
        id: artifacts
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.check.outputs.version }}
        run: python3 scripts/collect-release.py
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ steps.artifacts.outputs.target }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: release
          merge-multiple: true
      - name: Write checksums
        working-directory: release
        run: sha256sum -- * > SHA256SUMS
      - name: Publish all platforms together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          flags=(--verify-tag --generate-notes --title "MyNotebook $TAG")
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" release/* "${flags[@]}"
